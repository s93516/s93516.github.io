<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18世紀義民廟 | 閩南建築數位導覽</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Noto Serif TC', serif; background-color: #fdfbf7; color: #2c241b; }
        .text-accent { color: #8b2626; } .bg-accent { background-color: #8b2626; }
        .navbar { background-color: rgba(44, 36, 27, 0.95) !important; backdrop-filter: blur(5px); }
        .hero-section { background: linear-gradient(rgba(15, 12, 9, 0.7), rgba(15, 12, 9, 0.8)), url('https://picsum.photos/1920/1080?random=10') center/cover no-repeat fixed; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; color: #fff; }
        .hero-title { font-size: 4rem; letter-spacing: 0.2em; font-weight: 900; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .section-divider { width: 2px; height: 60px; background-color: #8b2626; margin: 0 auto 2rem; }
        .artifact-card { transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; border: 1px solid #e0d5c1; }
        .artifact-card:hover { transform: translateY(-8px); box-shadow: 0 10px 20px rgba(139, 38, 38, 0.1) !important; }
    </style>
</head>
<body data-bs-spy="scroll" data-bs-target="#navbar" data-bs-offset="100">
<nav id="navbar" class="navbar navbar-expand-lg navbar-dark fixed-top shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#hero"><i class="bi bi-bank"></i> 數位展藏</a>
    </div>
</nav>
<header id="hero" class="hero-section">
    <div class="container">
        <p class="fs-4 text-white-50 mb-3" style="letter-spacing: 0.3em;">18世紀台灣地方記憶</p>
        <h1 class="hero-title mb-4">義民廟與閩南建築特展</h1>
        <a href="#intro" class="btn btn-outline-light btn-lg px-5 rounded-0 border-2">開始導覽</a>
    </div>
</header>
<section id="intro" class="py-5 mt-5">
    <div class="container py-5 text-center">
        <div class="section-divider"></div>
        <h2 class="fw-bold mb-5 text-accent">時代的見證</h2>
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <p class="fs-5 lh-lg text-muted text-start">
                    18世紀的台灣，社會發展伴隨著地方聚落的擴張。義民廟不僅是信仰的中心，更是凝聚地方情感、記錄歷史動盪的重要場域。本展覽透過數位重建技術，保留當時的廟宇格局、生活道具與建築美學，邀請您細細品味。
                </p>
            </div>
        </div>
    </div>
</section>

<section id="architecture" class="py-5 bg-white border-top border-bottom">
    <div class="container py-5">
        <h2 class="fw-bold text-center mb-5 text-accent">閩南建築工藝</h2>
        <div class="row gy-4">
            <div class="col-md-4">
                <div class="card h-100 border-0 shadow-sm bg-light">
                    <img src="https://picsum.photos/seed/temple1/600/400" class="card-img-top rounded-0" alt="燕尾脊">
                    <div class="card-body p-4 text-center">
                        <h4 class="fw-bold mb-3">燕尾脊</h4>
                        <p class="text-muted">屋頂正脊兩端向上彎起，形如燕子飛翔的尾巴，是傳統尊貴與神聖地位的象徵。</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 border-0 shadow-sm bg-light">
                    <img src="https://picsum.photos/seed/temple2/600/400" class="card-img-top rounded-0" alt="木雕斗栱">
                    <div class="card-body p-4 text-center">
                        <h4 class="fw-bold mb-3">木雕斗栱</h4>
                        <p class="text-muted">精細的木構件，不用一根鐵釘即可支撐屋頂重量，並雕刻各種歷史故事與吉祥圖騰。</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 border-0 shadow-sm bg-light">
                    <img src="https://picsum.photos/seed/temple3/600/400" class="card-img-top rounded-0" alt="石雕龍柱">
                    <div class="card-body p-4 text-center">
                        <h4 class="fw-bold mb-3">石雕龍柱</h4>
                        <p class="text-muted">立於前殿的盤龍石柱，展現了18世紀匠人高超的立體透雕技法與對神明的敬畏。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
